spring:
  datasource:
    url: jdbc:h2:mem:devpilot-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

ai:
  llm:
    enabled: false
  executor:
    mode: local
  repository:
    root: ${java.io.tmpdir}/devpilot-test/workspaces
